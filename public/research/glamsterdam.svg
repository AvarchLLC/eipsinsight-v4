<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What Glamsterdam breaks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15121F"/>
      <stop offset="1" stop-color="#0B0A12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E5484D"/>
      <stop offset="1" stop-color="#F2676B"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="639" height="359" rx="0" stroke="#2A2540" stroke-opacity="0.6"/>

  <!-- eyebrow -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#9488EC">
    <circle cx="44" cy="48" r="4" fill="#9488EC"/>
    <text x="56" y="53">EIP-8037 / 8038 · GLAMSTERDAM</text>
  </g>

  <!-- title -->
  <text x="44" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F4F4F8">What Glamsterdam</text>
  <text x="44" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F4F4F8">breaks</text>

  <!-- hard-break bars -->
  <g>
    <rect x="44" y="214" width="300" height="16" rx="4" fill="url(#bar)"/>
    <text x="356" y="227" font-family="ui-monospace, monospace" font-size="13" fill="#C9C7D6">50%</text>
    <rect x="44" y="240" width="204" height="16" rx="4" fill="url(#bar)"/>
    <text x="260" y="253" font-family="ui-monospace, monospace" font-size="13" fill="#C9C7D6">34%</text>
    <rect x="44" y="266" width="156" height="16" rx="4" fill="url(#bar)"/>
    <text x="212" y="279" font-family="ui-monospace, monospace" font-size="13" fill="#C9C7D6">26%</text>
  </g>

  <!-- caption -->
  <text x="44" y="322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#8E8CA3">Differential replay of real mainnet txs · ERC-4337 account abstraction hard-breaks</text>

  <!-- brand corner -->
  <text x="596" y="330" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#6E6A86">EIPsInsight</text>
</svg>
